<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quiz Famille</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg1:#020611; --bg2:#081a3a; --bg3:#0b2a52;
    --accent:#38bdf8; --accent2:#22d3ee; --gold:#fbbf24; --gold2:#f59e0b;
    --good:#22c55e; --danger:#ef4444;
    --card:linear-gradient(170deg,#0c1f42,#050f22 65%);
    --panel:rgba(56,189,248,.08);
    --text:#eaf4ff; --muted:#8fa8cf; --line:rgba(56,189,248,.35);
  }
  *{box-sizing:border-box;}
  html, body{ height:100%; }
  body{
    margin:0; min-height:100vh; font-family:'Poppins',Roboto,Arial,sans-serif;
    background:
      radial-gradient(circle at 20% 10%, rgba(56,189,248,.25), transparent 42%),
      radial-gradient(circle at 85% 20%, rgba(34,211,238,.18), transparent 45%),
      radial-gradient(circle at 50% 100%, rgba(11,42,82,.6), transparent 55%),
      linear-gradient(160deg,var(--bg1),var(--bg2) 55%,var(--bg3));
    background-attachment:fixed;
    display:flex; align-items:center; justify-content:center; padding:20px;
    color:var(--text);
    position:relative; overflow-x:hidden;
  }
  body::before, body::after{
    content:""; position:fixed; width:480px; height:480px; border-radius:50%;
    filter:blur(110px); z-index:0; pointer-events:none; opacity:.35;
    animation:floatBlob 22s ease-in-out infinite;
  }
  body::before{ background:#0ea5e9; top:-160px; left:-140px; }
  body::after{ background:#22d3ee; bottom:-160px; right:-140px; animation-delay:-11s; }
  @keyframes floatBlob{
    0%,100%{ transform:translate(0,0) scale(1); }
    50%{ transform:translate(60px,40px) scale(1.15); }
  }
  .app{width:100%; max-width:600px; position:relative; z-index:1;}
  .topbar{
    display:flex; align-items:center; justify-content:space-between;
    padding:10px 18px; margin-bottom:12px; border-radius:16px;
    background:rgba(8,26,58,.55); border:1px solid var(--line); backdrop-filter:blur(8px);
    color:#eaf4ff; font-size:.85rem; font-weight:600;
  }
  .topbar .me{display:flex; align-items:center; gap:8px;}
  .topbar .avatar{
    width:30px; height:30px; border-radius:50%; background:linear-gradient(135deg,var(--gold),var(--gold2));
    display:flex; align-items:center; justify-content:center; font-size:1rem; overflow:hidden;
  }
  .avatar-fill-img{ width:100%; height:100%; border-radius:50%; object-fit:cover; display:block; }
  .topbar button{
    background:rgba(56,189,248,.12); border:1px solid var(--line); color:#eaf4ff; border-radius:10px;
    padding:7px 10px; cursor:pointer; font-size:1rem;
  }
  .topbar button:hover{background:rgba(56,189,248,.24);}
  .card{
    background:var(--card); border:1px solid var(--line); border-radius:24px; padding:30px 26px;
    box-shadow:0 25px 70px rgba(0,0,0,.55), 0 0 40px rgba(56,189,248,.08) inset; animation:fadeIn .35s ease;
  }
  @keyframes fadeIn{from{opacity:0; transform:translateY(10px);} to{opacity:1; transform:translateY(0);}}
  h1{
    font-size:1.5rem; margin:0 0 4px; text-align:center; font-weight:800; color:#eaf4ff;
    text-shadow:0 0 18px rgba(56,189,248,.5);
  }
  .subtitle{text-align:center; color:var(--muted); margin:0 0 22px; font-size:.92rem;}
  label{display:block; font-weight:600; margin:16px 0 8px; font-size:.9rem; color:#bcd6f7;}
  select, input[type=text], input[type=password]{
    width:100%; padding:12px 13px; border-radius:999px; border:1.5px solid var(--line);
    font-size:1rem; background:rgba(56,189,248,.06); color:#eaf4ff; font-family:inherit;
  }
  select option{ background:#0b2140; color:#eaf4ff; }
  .theme-grid{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
  .theme-btn{
    position:relative; border:1.5px solid var(--line); background:rgba(56,189,248,.06); border-radius:999px; padding:16px 12px;
    text-align:center; cursor:pointer; font-size:.9rem; font-weight:600; transition:.15s; color:#eaf4ff;
  }
  .theme-btn:hover{border-color:var(--accent); transform:translateY(-2px); box-shadow:0 0 16px rgba(56,189,248,.35);}
  .theme-btn.selected{border-color:var(--gold); background:rgba(251,191,36,.14); color:var(--gold); box-shadow:0 0 18px rgba(251,191,36,.35);}
  .theme-btn{border-top-width:3px; border-top-style:solid;}
  .option.selected-multi{border-color:var(--gold); background:rgba(251,191,36,.12); color:var(--gold);}
  .name-grid{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:6px;}
  .name-btn{
    border:1.5px solid var(--line); background:rgba(56,189,248,.06); border-radius:999px; padding:18px 10px;
    text-align:center; cursor:pointer; font-weight:700; transition:.15s; font-size:1.02rem; color:#eaf4ff;
  }
  .name-btn .emoji{font-size:1.8rem; display:block; margin-bottom:4px;}
  .name-btn:hover{border-color:var(--accent); transform:translateY(-2px); box-shadow:0 0 16px rgba(56,189,248,.35);}
  .name-btn.selected{border-color:var(--gold); background:rgba(251,191,36,.14); box-shadow:0 0 18px rgba(251,191,36,.35);}
  .players{display:flex; flex-direction:column; gap:8px;}
  .player-row{
    display:flex; align-items:center; gap:10px; background:rgba(56,189,248,.06); border:1.5px solid var(--line);
    border-radius:999px; padding:10px 16px;
  }
  .player-row input[type=checkbox]{width:18px; height:18px;}
  .player-row span{font-weight:600;}
  .btn{
    display:block; width:100%; padding:15px; border:none; border-radius:999px;
    font-size:1.05rem; font-weight:700; cursor:pointer; margin-top:18px; transition:.15s;
  }
  .btn-primary{background:linear-gradient(135deg,var(--gold),var(--gold2)); color:#1e1b4b; box-shadow:0 8px 24px rgba(251,191,36,.4);}
  .btn-primary:hover{filter:brightness(1.05); transform:translateY(-1px);}
  .btn-primary:disabled{opacity:.4; cursor:not-allowed; box-shadow:none; transform:none;}
  .btn-secondary{background:rgba(56,189,248,.14); color:#eaf4ff; border:1px solid var(--line);}
  .btn-danger{background:rgba(239,68,68,.16); color:#fca5a5; border:1px solid rgba(239,68,68,.4);}
  .btn-link{display:block; width:100%; text-align:center; background:none; border:none; color:var(--accent); text-decoration:underline; padding:10px; font-weight:600; cursor:pointer; font-size:.92rem;}
  .footer-actions{display:flex; gap:10px; margin-top:20px;}
  .footer-actions .btn{margin-top:0;}

  .intro-avatar{font-size:3.4rem; text-align:center; margin-bottom:6px;}
  .intro-name{text-align:center; font-size:1.6rem; font-weight:800; color:#eaf4ff; margin-bottom:6px; text-shadow:0 0 16px rgba(56,189,248,.45);}
  .intro-hint{text-align:center; color:var(--muted); margin-bottom:6px; font-size:.92rem;}

  /* Logo circulaire "Les MESSI" façon générique jeu télé */
  .qpuc-logo{ display:flex; justify-content:center; margin:0 auto 14px; filter:drop-shadow(0 0 18px rgba(56,189,248,.45)); }

  .quiz-top{display:flex; justify-content:space-between; align-items:center; margin-bottom:14px;}
  .quiz-progress{font-size:.85rem; color:var(--muted); font-weight:600;}
  .timer-gauge{ position:relative; width:54px; height:54px; flex-shrink:0; }
  .timer-gauge svg{ transform:rotate(-90deg); overflow:visible; }
  .timer-track{ fill:none; stroke:rgba(56,189,248,.18); stroke-width:6; }
  .timer-fill{ fill:none; stroke:var(--accent); stroke-width:6; stroke-linecap:round; transition:stroke-dashoffset 1s linear, stroke .3s; }
  .timer-fill.warn{ stroke:var(--danger); }
  .timer-number{ position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font-weight:800; font-size:1rem; color:#eaf4ff; }
  .timer-number.warn{ color:#fca5a5; }
  .progress-bar-bg{width:100%; height:6px; background:rgba(56,189,248,.15); border-radius:8px; overflow:hidden; margin-bottom:20px;}
  .progress-bar-fill{height:100%; background:linear-gradient(90deg,var(--accent),var(--gold)); transition:width .3s linear;}
  .question-pill{
    position:relative; text-align:center; font-size:1.1rem; font-weight:700; margin:0 0 20px; color:#eaf4ff; line-height:1.4;
    background:linear-gradient(180deg,rgba(56,189,248,.16),rgba(8,26,58,.6)); border:1.5px solid var(--line);
    border-radius:999px; padding:16px 22px;
  }
  .question-pill::before, .question-pill::after{
    content:""; position:absolute; top:50%; width:22px; height:2px; background:linear-gradient(90deg,var(--accent),transparent);
    transform:translateY(-50%);
  }
  .question-pill::before{ left:-20px; }
  .question-pill::after{ right:-20px; background:linear-gradient(90deg,transparent,var(--accent)); }
  .options{display:flex; flex-direction:column; gap:10px;}
  .option{
    position:relative; display:flex; align-items:center; gap:10px;
    text-align:left; padding:13px 18px; border-radius:999px; border:1.5px solid var(--line);
    background:rgba(56,189,248,.06); cursor:pointer; font-size:.96rem; font-weight:600; color:#eaf4ff;
    transition:.12s;
  }
  .option-letter{
    flex-shrink:0; display:inline-flex; align-items:center; justify-content:center; width:24px; height:24px;
    border-radius:50%; background:rgba(251,191,36,.16); color:var(--gold); font-weight:800; font-size:.82rem;
  }
  .option:hover{border-color:var(--accent); transform:translateX(2px); box-shadow:0 0 14px rgba(56,189,248,.3);}
  .option.correct{background:rgba(34,197,94,.18); border-color:#22c55e; color:#bbf7d0; box-shadow:0 0 16px rgba(34,197,94,.4);}
  .option.correct .option-letter{ background:rgba(34,197,94,.3); color:#bbf7d0; }
  .option.wrong{background:rgba(239,68,68,.18); border-color:#ef4444; color:#fecaca; box-shadow:0 0 16px rgba(239,68,68,.4);}
  .option.wrong .option-letter{ background:rgba(239,68,68,.3); color:#fecaca; }
  .option.disabled{pointer-events:none;}

  /* Classement du jeu en direct : avatars alignés + score en dessous */
  .podium-row{ display:flex; flex-wrap:wrap; justify-content:center; gap:10px; margin-bottom:6px; }
  .podium-card{
    flex:1 1 90px; min-width:82px; max-width:120px; text-align:center; padding:14px 8px 12px;
    border-radius:18px; background:rgba(56,189,248,.07); border:1.5px solid var(--line); position:relative;
  }
  .podium-card.lead{ border-color:var(--gold); background:rgba(251,191,36,.12); box-shadow:0 0 22px rgba(251,191,36,.4); }
  .podium-card.me{ border-color:var(--accent2); }
  .podium-medal{ font-size:1.2rem; margin-bottom:2px; min-height:1.4rem; }
  .podium-avatar{
    width:52px; height:52px; border-radius:50%; margin:0 auto 8px; font-size:1.7rem;
    display:flex; align-items:center; justify-content:center; overflow:hidden;
    background:linear-gradient(160deg,rgba(56,189,248,.25),rgba(8,26,58,.7)); border:1.5px solid var(--line);
  }
  .podium-card.lead .podium-avatar{ border-color:var(--gold); box-shadow:0 0 14px rgba(251,191,36,.5); }
  .podium-name{ font-size:.78rem; font-weight:700; color:#dbeafe; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; margin-bottom:6px; }
  /* Pupitre façon "buzzer" de jeu télé, avec écran digital affichant la note */
  .buzzer{ display:flex; flex-direction:column; align-items:center; width:100%; }
  .buzzer-btn{
    width:18px; height:18px; border-radius:50%; margin-bottom:-3px; z-index:2;
    background:radial-gradient(circle at 35% 30%,#fb7185,#dc2626 75%);
    border:2px solid #7f1d1d; box-shadow:0 2px 5px rgba(0,0,0,.4);
  }
  .buzzer-body{
    width:82%; background:linear-gradient(180deg,#94a3b8,#475569 55%,#334155);
    border-radius:8px 8px 4px 4px; border:1.5px solid #1e293b; padding:6px 4px;
    display:flex; justify-content:center; box-shadow:0 4px 12px rgba(0,0,0,.35);
  }
  .buzzer-screen{
    background:#04101f; border:1px solid var(--accent); border-radius:4px; padding:1px 12px;
    font-weight:800; font-size:1.1rem; color:var(--accent2); text-shadow:0 0 8px rgba(34,211,238,.8);
    min-width:22px; text-align:center; font-variant-numeric:tabular-nums;
  }
  .podium-card.lead .buzzer-screen{ color:var(--gold); border-color:var(--gold); text-shadow:0 0 8px rgba(251,191,36,.8); }

  .rank-row{
    display:flex; align-items:center; gap:12px; padding:12px 14px; border-radius:16px;
    background:rgba(56,189,248,.06); border:1px solid var(--line); margin-bottom:8px; position:relative; overflow:hidden;
  }
  .rank-row.me{border:2px solid var(--gold);}
  .rank-row.top1{background:rgba(251,191,36,.14); border-color:var(--gold);}
  .rank-medal{font-size:1.4rem; width:32px; text-align:center; z-index:1;}
  .rank-name{flex:1; font-weight:700; z-index:1; color:#eaf4ff;}
  .rank-score{font-weight:800; color:var(--gold); z-index:1;}
  .rank-bar{position:absolute; left:0; top:0; bottom:0; background:rgba(56,189,248,.15); z-index:0; transition:width .5s ease;}
  .badge-multi{display:block; text-align:center; margin-bottom:10px;}
  .section-title{font-size:.85rem; text-transform:uppercase; letter-spacing:.05em; color:var(--muted); margin:22px 0 10px; font-weight:700;}
  .small-note{font-size:.78rem; color:var(--muted); text-align:center; margin-top:14px;}
  .hidden{display:none !important;}
  .pin-input{text-align:center; font-size:1.6rem; letter-spacing:.4em; margin-top:14px;}
  .pin-error{color:#fca5a5; text-align:center; margin-top:10px; font-size:.85rem; min-height:1em;}
  .badge{display:inline-block; padding:3px 10px; border-radius:20px; font-size:.72rem; font-weight:700; background:rgba(56,189,248,.16); color:#bae6fd; margin-left:6px;}
  .kpi-grid{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:6px;}
  .kpi-card{background:rgba(56,189,248,.06); border-radius:14px; padding:14px 14px; border:1.5px solid var(--line);}
  .kpi-value{font-size:1.35rem; font-weight:800; color:#eaf4ff; line-height:1.2;}
  .kpi-label{font-size:.76rem; color:var(--muted); margin-top:2px;}
  .player-stat-card{background:rgba(56,189,248,.06); border-radius:14px; padding:14px 16px; margin-bottom:8px; border:1.5px solid var(--line);}
  .player-stat-head{display:flex; align-items:center; gap:8px; margin-bottom:8px;}
  .player-stat-head .name{font-weight:800; flex:1; color:#eaf4ff;}
  .player-stat-metrics{display:grid; grid-template-columns:repeat(3,1fr); gap:8px; font-size:.78rem; color:var(--muted); text-align:center;}
  .player-stat-metrics b{display:block; font-size:1rem; color:#eaf4ff;}
  .trend-up{color:#4ade80; font-weight:800;}
  .trend-down{color:#f87171; font-weight:800;}
  .trend-flat{color:#94a3b8; font-weight:800;}

  .stats-table{width:100%; border-collapse:collapse; font-size:.8rem;}
  .stats-table th{
    text-align:center; color:var(--muted); font-weight:700; font-size:.65rem; letter-spacing:.03em;
    text-transform:uppercase; padding:6px 4px; border-bottom:2px solid var(--line); white-space:nowrap;
  }
  .stats-table td{
    padding:10px 4px; text-align:center; border-bottom:1px solid rgba(56,189,248,.12); font-weight:700; color:#dbeafe; white-space:nowrap;
  }
  .stats-table th:nth-child(2), .stats-table td:nth-child(2){ text-align:left; }
  .stats-table th:nth-child(7), .stats-table td:nth-child(7){ text-align:left; }
  .stats-table tr.top1 td{ background:rgba(251,191,36,.14); }
  .stats-table tr.me-row td{ background:rgba(56,189,248,.1); }
  .stats-table .player-cell{ display:flex; align-items:center; gap:6px; font-weight:800; color:#eaf4ff; }
  .stats-table .pts-cell{ font-weight:800; color:var(--gold); font-size:.92rem; }
  .form-dot{
    display:inline-flex; align-items:center; justify-content:center; min-width:20px; height:20px;
    padding:0 4px; border-radius:10px; font-size:.68rem; font-weight:800; margin:0 1px;
  }
  .form-win{ background:rgba(34,197,94,.2); color:#4ade80; }
  .form-loss{ background:rgba(239,68,68,.2); color:#f87171; }
  .spinner{width:34px; height:34px; border:4px solid rgba(56,189,248,.15); border-top-color:var(--accent); border-radius:50%; animation:spin 1s linear infinite; margin:20px auto;}
  @keyframes spin{to{transform:rotate(360deg);}}

  /* ============== ADAPTATION MOBILE ============== */
  @media (max-width: 600px){
    body{ padding:0; align-items:flex-start; }
    .app{ max-width:100%; }
    .card{ border-radius:0; min-height:100vh; padding:22px 16px 34px; box-shadow:none; }
    .topbar{ border-radius:0; margin-bottom:0; padding:10px 14px; }
  }
  @media (max-width: 420px){
    h1{ font-size:1.3rem; }
    .subtitle{ font-size:.85rem; margin-bottom:18px; }
    .card{ padding:18px 14px 30px; }
    .theme-grid, .name-grid{ gap:8px; }
    .theme-btn{ padding:13px 8px; font-size:.86rem; }
    .name-btn{ padding:14px 8px; font-size:.92rem; }
    .btn{ padding:14px; font-size:1rem; }
    .footer-actions{ flex-wrap:wrap; }
    .kpi-grid{ gap:8px; }
    .kpi-value{ font-size:1.15rem; }
    .player-stat-metrics{ font-size:.72rem; }
    .stats-table{ font-size:.72rem; }
    .stats-table th{ font-size:.6rem; padding:6px 3px; }
    .stats-table td{ padding:9px 3px; }
    .question-pill{ font-size:1rem; padding:14px 16px; }
    .option{ padding:12px 14px; font-size:.9rem; }
    .podium-card{ min-width:72px; padding:10px 6px 8px; }
    .podium-avatar{ width:44px; height:44px; font-size:1.4rem; }
    .buzzer-screen{ font-size:.95rem; padding:1px 8px; }
    .timer-gauge{ width:46px; height:46px; }
  }
</style>
</head>
<body>
<div class="app">
  <div class="topbar hidden" id="topbar"></div>
  <div class="card" id="app-card"></div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
/* ================================================================
   CONFIGURATION FIREBASE
   Remplace les valeurs ci-dessous par celles de TON projet Firebase
   (Console Firebase > Paramètres du projet > Tes applications > Config).
   Voir SETUP_INSTRUCTIONS.md pour le pas-à-pas complet.
================================================================= */
const firebaseConfig = {
  apiKey: "AIzaSyD3npa9nfJ9Nc0g52JQeNpyhcYRO7Mxuzo",
  authDomain: "quizz-nguem.firebaseapp.com",
  projectId: "quizz-nguem",
  storageBucket: "quizz-nguem.firebasestorage.app",
  messagingSenderId: "1063925717604",
  appId: "1:1063925717604:web:42725e4753be66b5fb5d71"
};

/* Code admin : c'est ce qui te permet, et toi seul, de choisir le jeu de la semaine.
   Change cette valeur quand tu veux, directement ici. */
const PIN_CODE = "1991";

const PLAYER_AVATARS = {
  "Jopa":"🦉", "Majes":"🦁", "Thurell":"🐯", "Bambi":"🐻", "Sorel":"🐺"
};
/* Vraies photos des joueurs, hébergées dans le même dépôt GitHub que ce fichier */
const PLAYER_PHOTOS = {
  "Jopa":"https://raw.githubusercontent.com/Ghjiiu433gh89jvt4/quiz-famille/main/jopa.jpg.jpg",
  "Majes":"https://raw.githubusercontent.com/Ghjiiu433gh89jvt4/quiz-famille/main/majes.jpg.jpg",
  "Thurell":"https://raw.githubusercontent.com/Ghjiiu433gh89jvt4/quiz-famille/main/thurell.jpg.jpg",
  "Bambi":"https://raw.githubusercontent.com/Ghjiiu433gh89jvt4/quiz-famille/main/bambi.jpg.jpg",
  "Sorel":"https://raw.githubusercontent.com/Ghjiiu433gh89jvt4/quiz-famille/main/sorel.jpg.jpeg"
};
function avatarFor(name){ return PLAYER_AVATARS[name] || "🙂"; }
/* Avatar qui remplit entièrement son conteneur déjà dimensionné/arrondi
   (ex: .avatar, .podium-avatar) : photo si dispo, sinon emoji de secours. */
function avatarFill(name){
  const photo = PLAYER_PHOTOS[name];
  if(photo) return `<img class="avatar-fill-img" src="${photo}" alt="${name}" loading="lazy">`;
  return avatarFor(name);
}
/* Avatar autonome de taille fixe (px), utilisable n'importe où dans le HTML
   sans conteneur pré-dimensionné : photo circulaire si dispo, sinon emoji. */
function avatarBadge(name, px){
  const photo = PLAYER_PHOTOS[name];
  if(photo) return `<img src="${photo}" alt="${name}" loading="lazy" style="width:${px}px;height:${px}px;border-radius:50%;object-fit:cover;display:inline-block;vertical-align:middle;">`;
  return `<span style="display:inline-block;width:${px}px;height:${px}px;line-height:${px}px;text-align:center;font-size:${Math.round(px*0.6)}px;vertical-align:middle;">${avatarFor(name)}</span>`;
}

/* Logo circulaire "Les MESSI" façon générique de jeu télé (voir écrans d'accueil/attente) */
function renderLogoBadge(size){

/* ============== UTILS ============== */
function shuffle(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; }
  return a;
}
function todayStr(){
  const d = new Date();
  return d.toLocaleDateString('fr-FR', {day:'2-digit', month:'2-digit', year:'numeric'});
}

let db, auth;

/* Coupe les écoutes temps réel propres à un écran, avant d'en afficher un autre
   (évite qu'un ancien écouteur "stats" ou "classement du jeu" écrase l'écran actuel). */
function stopScreenListeners(){
  if(liveResultsUnsub){ liveResultsUnsub(); liveResultsUnsub = null; }
  if(historySnapUnsub){ historySnapUnsub(); historySnapUnsub = null; }
}

/* ============== DEMARRAGE / FIREBASE ============== */
function isConfigMissing(){
  return !firebaseConfig.apiKey || firebaseConfig.apiKey.indexOf("COLLE_ICI") !== -1;
}

function boot(){
  if(isConfigMissing()){
    renderSetupNeeded();
    return;
  }
  try{
    firebase.initializeApp(firebaseConfig);
    auth = firebase.auth();
    db = firebase.firestore();
    // Garde une copie locale (sur le téléphone) des données déjà vues : au prochain
    // lancement de l'appli, l'historique et le classement s'affichent instantanément
    // depuis ce cache, pendant que les toutes dernières données arrivent en tâche de fond.
    db.enablePersistence({synchronizeTabs:true}).catch(()=>{});
  }catch(e){
    renderFatalError(e);
    return;
  }
  renderConnecting();
  auth.onAuthStateChanged(user=>{
    if(user){
      startApp();
    }
  });
  auth.signInAnonymously().catch(err=>{
    renderFatalError(err);
  });
}

      Ouvre <strong>index.html</strong> avec un éditeur de texte, repère le bloc <code>firebaseConfig</code>

  topbarEl.classList.add("hidden");

  `;
}

function renderNamePicker(){
  topbarEl.classList.add("hidden");
  el.innerHTML = `
    ${renderLogoBadge(120)}
    <h1>Bienvenue !</h1>
    <p class="subtitle">Qui es-tu ?</p>
    <div class="name-grid" id="name-grid">
      ${DEFAULT_PLAYERS.map(p=>`<div class="name-btn" data-name="${p}"><div style="margin:0 auto 4px;">${avatarBadge(p,48)}</div>${p}</div>`).join('')}
    </div>
    <label>Ou un autre prénom</label>
    <input type="text" id="custom-name" placeholder="Ton prénom">
    <button class="btn btn-primary" id="confirm-name-btn">Continuer ▶️</button>
  `;
  let selected = null;
  document.querySelectorAll(".name-btn").forEach(btn=>{
    btn.addEventListener("click", ()=>{
      document.querySelectorAll(".name-btn").forEach(b=>b.classList.remove("selected"));
      btn.classList.add("selected");
      selected = btn.dataset.name;
      document.getElementById("custom-name").value = "";
    });
  });
  document.getElementById("custom-name").addEventListener("input", e=>{
    if(e.target.value.trim()){
      document.querySelectorAll(".name-btn").forEach(b=>b.classList.remove("selected"));
      selected = null;
    }
  });
  document.getElementById("confirm-name-btn").addEventListener("click", ()=>{
    const custom = document.getElementById("custom-name").value.trim();
    const name = custom || selected;
    if(!name){ alert("Choisis ou écris un prénom."); return; }
    myName = name;
    localStorage.setItem("qf_playerName", name);
    attachTopbar();
    attachStateListener();
  });
}

/* ============== ECOUTE DE L'ETAT GLOBAL (TEMPS REEL) ============== */
function attachStateListener(){
  db.collection("meta").doc("state").onSnapshot(doc=>{
    const data = doc.exists ? doc.data() : {activeGame:null};
    handleActiveGame(data.activeGame || null);
  }, err=>{
    renderFatalError(err);
  });
}

/* ============== QUIZ CULTURE : QUESTION + CHRONO ============== */
function renderQuizQuestion(){
  clearInterval(quizState.timerId);
  const { activeGame } = quizState;
  const total = activeGame.questions.length;
  const item = activeGame.questions[quizState.qIndex];
  const isMulti = item.type === "multi";
  quizState.timeLeft = activeGame.chrono;
  let selected = new Set();

  const CIRC = 2 * Math.PI * 26;
  const LETTERS = ["A","B","C","D","E","F"];

  el.innerHTML = `
    <div class="quiz-top">
      <span class="quiz-progress">Question ${quizState.qIndex+1} / ${total}</span>
      <div class="timer-gauge" id="timer-gauge">
        <svg viewBox="0 0 60 60" width="54" height="54">
          <circle class="timer-track" cx="30" cy="30" r="26"></circle>
          <circle class="timer-fill" id="timer-fill-circle" cx="30" cy="30" r="26"
            stroke-dasharray="${CIRC}" stroke-dashoffset="0"></circle>
        </svg>
        <span class="timer-number" id="timer-badge">${quizState.timeLeft}</span>
      </div>
    </div>
    <div class="progress-bar-bg"><div class="progress-bar-fill" id="progress-fill" style="width:100%"></div></div>
    ${isMulti ? `<span class="badge badge-multi">✅ Plusieurs bonnes réponses possibles</span>` : ''}
    <div class="question-pill">${item.q}</div>
    <div class="options" id="options-wrap">
      ${item.options.map((opt,i)=>`<button class="option${isMulti?' option-multi':''}" data-val="${encodeURIComponent(opt)}"><span class="option-letter">${LETTERS[i]}</span><span>${opt}</span></button>`).join('')}
    </div>
    ${isMulti ? `<button class="btn btn-primary" id="submit-multi-btn" disabled>Valider ma réponse</button>` : ''}
  `;

  const badge = document.getElementById("timer-badge");
  const fillCircle = document.getElementById("timer-fill-circle");
  const fill = document.getElementById("progress-fill");

  if(isMulti){
    document.querySelectorAll(".option-multi").forEach(btn=>{
      btn.addEventListener("click", ()=>{
        const val = decodeURIComponent(btn.dataset.val);
        if(selected.has(val)){ selected.delete(val); btn.classList.remove("selected-multi"); }
        else { selected.add(val); btn.classList.add("selected-multi"); }
        document.getElementById("submit-multi-btn").disabled = selected.size === 0;
      });
    });
    document.getElementById("submit-multi-btn").addEventListener("click", ()=>{
      lockQuizAnswer(Array.from(selected));
    });
  } else {
    document.querySelectorAll(".option").forEach(btn=>{
      btn.addEventListener("click", ()=>{
        lockQuizAnswer(decodeURIComponent(btn.dataset.val));
      });
    });
  }

  quizState.timerId = setInterval(()=>{
    quizState.timeLeft--;
    const ratio = Math.max(quizState.timeLeft,0) / activeGame.chrono;
    badge.textContent = Math.max(quizState.timeLeft,0);
    fillCircle.style.strokeDashoffset = CIRC * (1 - ratio);
    fill.style.width = (ratio*100) + "%";
    if(quizState.timeLeft <= 5){ badge.classList.add("warn"); fillCircle.classList.add("warn"); }
    if(quizState.timeLeft <= 0){
      lockQuizAnswer(isMulti ? Array.from(selected) : null);
    }
  }, 1000);
}

function lockQuizAnswer(chosenVal){
  clearInterval(quizState.timerId);
  const { activeGame } = quizState;
  const item = activeGame.questions[quizState.qIndex];
  const isMulti = item.type === "multi";
  let isCorrect;

  if(isMulti){
    const chosenArr = chosenVal || [];
    const chosenSet = new Set(chosenArr);
    const correctSet = new Set(item.correct);
    isCorrect = chosenSet.size === correctSet.size && chosenArr.every(v=>correctSet.has(v));
    document.querySelectorAll(".option-multi").forEach(btn=>{
      const val = decodeURIComponent(btn.dataset.val);
      btn.classList.add("disabled");
      if(item.correct.includes(val)) btn.classList.add("correct");
      else if(chosenArr.includes(val)) btn.classList.add("wrong");
    });
    const subBtn = document.getElementById("submit-multi-btn");
    if(subBtn) subBtn.disabled = true;
  } else {
    isCorrect = chosenVal === item.correct;
    document.querySelectorAll(".option").forEach(btn=>{
      const val = decodeURIComponent(btn.dataset.val);
      btn.classList.add("disabled");
      if(val === item.correct) btn.classList.add("correct");
      else if(val === chosenVal) btn.classList.add("wrong");
    });
  }

  quizState.answers.push({isCorrect});

  setTimeout(()=>{
    if(quizState.qIndex + 1 < activeGame.questions.length){
      quizState.qIndex++;
      renderQuizQuestion();
    } else {
      finishQuiz();
    }
  }, isMulti ? 1400 : 900);
}

function finishQuiz(){
  const { activeGame, answers } = quizState;
  const score = answers.filter(a=>a.isCorrect).length;
  el.innerHTML = `<div class="spinner"></div><p class="subtitle">Envoi de ton score...</p>`;
  const resultId = activeGame.id + "_" + myName;
  db.collection("liveResults").doc(resultId).set({
    gameId: activeGame.id, mode:"quiz", key:activeGame.key, player: myName, score: score,
    finishedAt: firebase.firestore.FieldValue.serverTimestamp()
  }).then(()=>{
    renderGameResults(activeGame, {score});
  });
}

  let cachedHistory = [];

      historyLoaded = true;

    }, ()=>{
      db.collection("history").limit(500).get().then(histSnap=>{

      });
    });
  // Filet de sécurité : si après 4s toujours rien (connexion très lente), on affiche
  // quand même ce qu'on a plutôt que de laisser le spinner tourner indéfiniment.
  setTimeout(()=>{ if(!historyLoaded){ historyLoaded = true; renderSeasonBlock(); } }, 4000);

  liveResultsUnsub = db.collection("liveResults").where("gameId","==",activeGame.id)
    .onSnapshot(snap=>{
      const rows = [];

      }

      renderSeasonBlock();

/* Si une même partie (gameId) a été archivée plusieurs fois (ex. archivage
   déclenché deux fois pendant qu'un joueur finissait de répondre), on ne garde
   que la version la plus récente. Les parties sans gameId (anciennes données)
   sont dédupliquées sur mode+thème+date, par sécurité. */
function dedupeHistory(historyItems){
  const sorted = historyItems.slice().sort((a,b)=>{
    const ta = (a.createdAt && a.createdAt.toMillis) ? a.createdAt.toMillis() : 0;
    const tb = (b.createdAt && b.createdAt.toMillis) ? b.createdAt.toMillis() : 0;
    return tb - ta;
  });
  const seen = new Set();
  const out = [];
  sorted.forEach(h=>{
    const id = h.gameId || `${h.mode}_${h.key}_${h.date}`;
    if(seen.has(id)) return;
    seen.add(id);
    out.push(h);
  });
  return out;
}

/* ============== CALCUL DES STATISTIQUES ============== */
function computeStats(historyItems){
  // historyItems doit être trié du plus récent au plus ancien (desc)
  const quizItems = historyItems.filter(h=>h.mode === "quiz");

  // Historique des scores par joueur, du plus récent au plus ancien (avec indicateur de victoire par partie)
  const playerScores = {};
  quizItems.forEach(h=>{
    const entries = Object.entries(h.results || {});
    if(!entries.length) return;
    const maxScore = Math.max(...entries.map(([,s])=>s));
    entries.forEach(([name,score])=>{
      if(!playerScores[name]) playerScores[name] = [];
      playerScores[name].push({score, key:h.key, date:h.date, won: score === maxScore});
    });
  });

  // Taux de bonne réponse global (famille entière, tous quiz confondus)
  let totalPoints = 0, totalPossible = 0;
  quizItems.forEach(h=>{
    Object.values(h.results || {}).forEach(score=>{ totalPoints += score; totalPossible += 10; });
  });
  const globalAccuracy = totalPossible ? Math.round(totalPoints / totalPossible * 100) : null;

  // Thématique la plus jouée
  const themeCounts = {};
  quizItems.forEach(h=>{ themeCounts[h.key] = (themeCounts[h.key] || 0) + 1; });
  let topTheme = null, topThemeCount = 0;
  Object.entries(themeCounts).forEach(([k,c])=>{ if(c > topThemeCount){ topThemeCount = c; topTheme = k; } });

  // Record all-time (meilleur score individuel jamais obtenu)
  let record = null;
  quizItems.forEach(h=>{
    Object.entries(h.results || {}).forEach(([name,score])=>{
      if(!record || score > record.score){ record = {name, score, key:h.key, date:h.date}; }
    });
  });

  // Stats détaillées par joueur (victoires et forme déduites des indicateurs "won" ci-dessus)
  const playerStats = {};
  Object.entries(playerScores).forEach(([name, arr])=>{
    const games = arr.length;
    const totalPts = arr.reduce((a,b)=>a + b.score, 0);
    const avg = totalPts / games;
    const accuracy = Math.round(avg / 10 * 100);
    const best = arr.reduce((a,b)=> b.score > a.score ? b : a, arr[0]);
    const wins = arr.filter(x=>x.won).length;
    let progression = null;
    if(games >= 2){
      const latest = arr[0].score, prev = arr[1].score;
      progression = prev === 0 ? (latest > 0 ? 100 : 0) : Math.round((latest - prev) / prev * 100);
    }
    playerStats[name] = { games, points: totalPts, avg: Math.round(avg*10)/10, accuracy, best, progression, wins, last5: arr.slice(0,5), latest: arr[0] };
  });

  return {globalAccuracy, topTheme, topThemeCount, record, playerStats,
          totalQuizGames: quizItems.length};
}

/* Classement général sous forme de tableau, façon classement de championnat de foot.
   ranking: [[name, {points, games}], ...] déjà trié. playerStats: optionnel (stats.playerStats). */
function renderSeasonTableHTML(ranking, playerStats, highlightName){
  if(!ranking.length) return `<p class="small-note">Pas encore de quiz joué.</p>`;
  const medals = ["🥇","🥈","🥉"];
  const rows = ranking.map(([name,d],i)=>{
    const ps = playerStats ? playerStats[name] : null;
    const avgTxt = ps ? ps.avg + '/10' : '—';
    const bestTxt = ps ? ps.best.score + '/10' : '—';
    const winsTxt = ps ? ps.wins : '—';
    const last5 = ps ? ps.last5.slice().reverse() : [];
    const formHTML = last5.length
      ? last5.map(g=>`<span class="form-dot ${g.won?'form-win':'form-loss'}">${g.score}</span>`).join('')
      : '<span style="color:#cbd5e1;">—</span>';
    return `
      <tr class="${i===0?'top1':''} ${name===highlightName?'me-row':''}">
        <td>${medals[i] || (i+1)}</td>
        <td><div class="player-cell">${avatarBadge(name,22)} ${name}</div></td>
        <td>${d.games}</td>
        <td>${avgTxt}</td>
        <td>${bestTxt}</td>
        <td>${winsTxt}</td>
        <td>${formHTML}</td>
        <td class="pts-cell">${d.points}</td>
      </tr>
    `;
  }).join('');
  return `
    <div style="overflow-x:auto; margin-bottom:6px;">
      <table class="stats-table">
        <thead><tr>
          <th>#</th><th>Joueur</th><th>J</th><th>Moy</th><th>Meill.</th><th>Vict.</th><th>5 derniers</th><th>Pts</th>
        </tr></thead>
        <tbody>${rows}</tbody>
      </table>
    </div>
  `;
}

/* ============== ECRAN : HISTORIQUE & STATISTIQUES (ACCESSIBLE A TOUS) ============== */
function renderHistoryScreen(){
  el.innerHTML = `<div class="spinner"></div><p class="subtitle">Chargement des statistiques...</p>`;
  stopScreenListeners();

  // Tout est recalculé à partir des parties réellement présentes dans "history"
  // (jamais depuis un compteur séparé qui pourrait dériver de la réalité), et cet
  // écran écoute en temps réel : dès qu'une partie est archivée, ou que quelqu'un
  // termine la partie en cours, les stats et le classement se mettent à jour seuls.
  let rawHistoryItems = [];
  let liveGameResults = {};
  let liveGameInfo = null; // {key, gameId} de la partie en cours, si il y en a une
  let historyLoaded = false; // évite d'afficher des stats incomplètes avant que
                              // "history" ait fini de charger (course avec liveResults)

  if(currentActiveGame && currentActiveGame.mode === "quiz"){
    liveGameInfo = {key: currentActiveGame.key, gameId: currentActiveGame.id};
    liveResultsUnsub = db.collection("liveResults").where("gameId","==",currentActiveGame.id)
      .onSnapshot(snap=>{
        liveGameResults = {};
        snap.forEach(doc=>{ const d = doc.data(); liveGameResults[d.player] = d.score; });
        renderScreenFromData();
      });
  }

  historySnapUnsub = db.collection("history").orderBy("createdAt","desc").limit(500)
    .onSnapshot(histSnap=>{
      rawHistoryItems = [];
      histSnap.forEach(doc=> rawHistoryItems.push(doc.data()));
      historyLoaded = true;
      renderScreenFromData();
    }, ()=>{
      db.collection("history").limit(500).get().then(histSnap=>{
        rawHistoryItems = [];
        histSnap.forEach(doc=> rawHistoryItems.push(doc.data()));
        historyLoaded = true;
        renderScreenFromData();
      });
    });
  // Filet de sécurité : si après 4s toujours rien (connexion très lente), on affiche
  // quand même ce qu'on a plutôt que de laisser le spinner tourner indéfiniment.
  setTimeout(()=>{ if(!historyLoaded){ historyLoaded = true; renderScreenFromData(); } }, 4000);

  function renderScreenFromData(){
    if(!historyLoaded) return; // on attend d'avoir le vrai historique avant d'afficher quoi que ce soit
    const medals = ["🥇","🥈","🥉"];
    let historyItems = dedupeHistory(rawHistoryItems);
    if(liveGameInfo && Object.keys(liveGameResults).length && !historyItems.some(h=>h.gameId === liveGameInfo.gameId)){
      historyItems = [{
        mode:"quiz", key:liveGameInfo.key, date:todayStr(), results:liveGameResults,
        gameId:liveGameInfo.gameId, createdAt:{toMillis:()=>Date.now()}
      }, ...historyItems];
    }
    const stats = computeStats(historyItems);
    const ranking = Object.entries(stats.playerStats).map(([name,ps])=>[name, {points:ps.points, games:ps.games}]).sort((a,b)=>b[1].points-a[1].points);
    const topThemeLabel = stats.topTheme ? (THEMES[stats.topTheme] ? THEMES[stats.topTheme].label : stats.topTheme) : null;

    const statsRanking = Object.entries(stats.playerStats).sort((a,b)=> b[1].avg - a[1].avg);

    el.innerHTML = `
      <h1>📊 Statistiques & historique</h1>
      <p class="subtitle">${stats.totalQuizGames} quiz joués</p>

      <div class="section-title">Vue d'ensemble</div>
      <div class="kpi-grid">
        <div class="kpi-card">
          <div class="kpi-value">${stats.globalAccuracy !== null ? stats.globalAccuracy + '%' : '—'}</div>
          <div class="kpi-label">✅ Taux de bonne réponse global (famille)</div>
        </div>
        <div class="kpi-card">
          <div class="kpi-value">${stats.record ? stats.record.score + '/10' : '—'}</div>
          <div class="kpi-label">🏅 Record all-time${stats.record ? ` — ${stats.record.name}` : ''}</div>
        </div>
        <div class="kpi-card">
          <div class="kpi-value">${topThemeLabel || '—'}</div>
          <div class="kpi-label">🔥 Thématique la plus jouée${stats.topThemeCount ? ` (${stats.topThemeCount}x)` : ''}</div>
        </div>
        <div class="kpi-card">
          <div class="kpi-value">${stats.totalQuizGames}</div>
          <div class="kpi-label">🎮 Quiz Culture disputés au total</div>
        </div>
      </div>

      <div class="section-title">Classement général de la saison</div>
      ${renderSeasonTableHTML(ranking, stats.playerStats, myName)}
      <p class="small-note" style="margin-top:0;">J = parties jouées · Moy = score moyen · Meill. = meilleur score · Vict. = victoires de partie</p>

      <div class="section-title">Progression par joueur</div>
      ${statsRanking.length ? statsRanking.map(([name,s])=>{
        let trendHTML = `<span class="trend-flat">— première partie</span>`;
        if(s.progression !== null){
          if(s.progression > 0) trendHTML = `<span class="trend-up">▲ +${s.progression}% vs partie précédente</span>`;
          else if(s.progression < 0) trendHTML = `<span class="trend-down">▼ ${s.progression}% vs partie précédente</span>`;

              <span class="name">${name}</span>
              ${trendHTML}

            <div class="player-stat-metrics">
              <div><b>${s.games}</b>parties</div>
              <div><b>${s.accuracy}%</b>réussite moy.</div>
              <div><b>${s.best.score}/10</b>meilleur score</div>

        const label = THEMES[h.key] ? THEMES[h.key].label : h.key;
        const resultsTxt = Object.entries(h.results || {}).map(([n,v])=>{

        return `
          <div class="rank-row" style="flex-direction:column; align-items:flex-start;">
            <strong>${h.date || ''} · ${label}</strong>
            <span style="color:#64748b;font-size:.85rem;">${resultsTxt}</span>
          </div>
        `;
      }).join('') : `<p class="small-note">Pas encore d'historique.</p>`}

      <button class="btn btn-primary" id="back-btn">Retour</button>
    `;
    document.getElementById("back-btn").addEventListener("click", ()=>{
      handleActiveGame(currentActiveGame);
    });
  }
}

    <div class="intro-name">Mode Admin</div>
    <div class="intro-hint">Entre le code pour choisir le jeu de la semaine</div>
    <input type="password" id="pin-input" class="pin-input" inputmode="numeric" maxlength="8" placeholder="••••">
    <div class="pin-error" id="pin-error"></div>
    <button class="btn btn-primary" id="unlock-btn">Déverrouiller</button>
    <button class="btn-link" id="cancel-btn" type="button">Annuler</button>
  `;
  const input = document.getElementById("pin-input");
  const tryUnlock = ()=>{
    if(input.value === PIN_CODE){ renderAdminDashboard(); }
    else {
      document.getElementById("pin-error").textContent = "Code incorrect.";
      input.value = ""; input.focus();
    }
  };
  document.getElementById("unlock-btn").addEventListener("click", tryUnlock);
  input.addEventListener("keydown", e=>{ if(e.key === "Enter") tryUnlock(); });
  document.getElementById("cancel-btn").addEventListener("click", ()=> handleActiveGame(currentActiveGame));
  input.focus();
}

function renderAdminDashboard(){
  el.innerHTML = `<div class="spinner"></div>`;
  db.collection("meta").doc("state").get().then(doc=>{
    const activeGame = doc.exists ? (doc.data().activeGame || null) : null;
    renderAdminDashboardWith(activeGame);
  });
}

function renderAdminDashboardWith(activeGame){
  let statusHTML = "";
  if(activeGame){
    const label = THEMES[activeGame.key] ? THEMES[activeGame.key].label : activeGame.key;
    statusHTML = `
      <div class="rank-row" style="flex-direction:column; align-items:flex-start;">
        <strong>Jeu en cours : ${label}</strong>
        <span style="color:#64748b;font-size:.85rem;" id="admin-live-count">Chargement des réponses...</span>
      </div>
      <button class="btn btn-danger" id="end-game-btn" type="button">Terminer ce jeu</button>
    `;
  } else {
    statusHTML = `<p class="small-note">Aucun jeu actif en ce moment.</p>`;
  }

  el.innerHTML = `
    <h1>⚙️ Tableau de bord admin</h1>
    <p class="subtitle">Choisis le jeu de la semaine</p>

    ${statusHTML}

    <div class="section-title">Quiz Culture (chrono)</div>
    <div class="theme-grid" id="admin-quiz-grid">
      ${Object.entries(THEMES).map(([key,t])=>`<div class="theme-btn" data-mode="quiz" data-key="${key}" style="border-top-color:${colorFor(key)};">${t.emoji}<br>${t.label.replace(/^\S+\s/,'')}</div>`).join('')}
    </div>
    <label>Temps par question</label>
    <select id="chrono-select">
      <option value="15">15 secondes</option>
      <option value="20" selected>20 secondes</option>
      <option value="25">25 secondes</option>
      <option value="30">30 secondes</option>
    </select>

    <button class="btn btn-primary" id="launch-btn" disabled>Choisis un jeu pour lancer</button>
    <button class="btn-link" id="recover-btn" type="button">🔧 Récupérer des parties perdues (si besoin)</button>
    <button class="btn btn-danger" id="reset-season-btn" type="button" style="margin-top:10px;">🗑️ Réinitialiser toute la saison (repartir à zéro à 5)</button>
    <button class="btn-link" id="back-btn" type="button">← Retour</button>
  `;

  let selectedMode = null, selectedKey = null;
  document.querySelectorAll("#admin-quiz-grid .theme-btn").forEach(btn=>{
    btn.addEventListener("click", ()=>{
      document.querySelectorAll("#admin-quiz-grid .theme-btn").forEach(b=>b.classList.remove("selected"));
      btn.classList.add("selected");
      selectedMode = btn.dataset.mode;
      selectedKey = btn.dataset.key;
      const launchBtn = document.getElementById("launch-btn");
      launchBtn.disabled = false;
      launchBtn.textContent = "🚀 Lancer ce jeu pour tout le monde";
    });
  });

  document.getElementById("launch-btn").addEventListener("click", ()=>{
    if(!selectedMode) return;
    launchGame(selectedMode, selectedKey, document.getElementById("chrono-select").value);
  });

  document.getElementById("back-btn").addEventListener("click", ()=> handleActiveGame(currentActiveGame));
  document.getElementById("recover-btn").addEventListener("click", recoverLostGames);
  document.getElementById("reset-season-btn").addEventListener("click", resetSeason);

  const endBtn = document.getElementById("end-game-btn");
  if(endBtn) endBtn.addEventListener("click", endGame);

  if(activeGame){
    db.collection("liveResults").where("gameId","==",activeGame.id).onSnapshot(snap=>{
      const el2 = document.getElementById("admin-live-count");
      if(el2) el2.textContent = snap.size + " joueur(s) ont déjà répondu";
    });
  }
}

function launchGame(mode, key, chronoValue){
  const doLaunch = (activeGame)=>{
    db.collection("meta").doc("state").set({activeGame}).then(()=>{
      renderAdminDashboardWith(activeGame);
    });
  };
  const buildAndLaunch = ()=>{
    if(mode === "quiz"){
      pickRotatingQuestions(key, 10).then(picked=>{
        const bank = picked.map(item=>({
          q:item.q, type:item.type || "single",
          options: shuffle(item.options), correct:item.correct
        }));
        doLaunch({ id:"g_"+Date.now(), mode:"quiz", key, chrono: parseInt(chronoValue,10), questions: bank, startedAt: Date.now() });
      });
    } else {
      doLaunch({ id:"g_"+Date.now(), mode:"perso", key, startedAt: Date.now() });
    }
  };
  // Archive automatiquement le jeu précédent (s'il y en a un) avant d'en lancer un nouveau,
  // pour ne jamais perdre de données même si "Terminer ce jeu" n'a pas été cliqué.
  db.collection("meta").doc("state").get().then(doc=>{
    const prevActiveGame = doc.exists ? (doc.data().activeGame || null) : null;
    if(prevActiveGame){
      archiveGame(prevActiveGame).then(buildAndLaunch);
    } else {
      buildAndLaunch();
    }
  });
}

/* Archive une partie active (résultats -> history + season) si elle a des réponses,
   sans jamais rien supprimer. Réutilisée par endGame() et par launchGame(). */
function archiveGame(activeGame){
  return db.collection("liveResults").where("gameId","==",activeGame.id).get().then(snap=>{
    if(snap.empty) return Promise.resolve();
    const results = {};
    snap.forEach(d=>{
      const data = d.data();
      results[data.player] = data.mode === "quiz" ? data.score : data.outcomeKey;
    });
    const histDoc = {
      gameId: activeGame.id, mode: activeGame.mode, key: activeGame.key, date: todayStr(),
      results, createdAt: firebase.firestore.FieldValue.serverTimestamp()
    };
    const tasks = [db.collection("history").add(histDoc)];
    if(activeGame.mode === "quiz"){
      tasks.push(db.collection("meta").doc("season").get().then(seasonSnap=>{
        const season = seasonSnap.exists ? seasonSnap.data() : {totals:{}};
        if(!season.totals) season.totals = {};
        Object.entries(results).forEach(([name,score])=>{
          if(!season.totals[name]) season.totals[name] = {points:0, games:0};
          season.totals[name].points += score;
          season.totals[name].games += 1;
        });
        return db.collection("meta").doc("season").set(season);
      }));
    }
    return Promise.all(tasks);
  });
}

/* Réinitialise complètement la saison : vide l'historique, les résultats de jeu et
   le classement, pour repartir de zéro maintenant qu'on joue à 5 (Sorel, Jopa, Bambi,
   Thurell, Majes). Action irréversible : double confirmation exigée (taper RESET). */
function resetSeason(){
  const typed = prompt(
    "⚠️ Cette action supprime DÉFINITIVEMENT tout l'historique des parties, les scores et le classement de la saison, pour repartir à zéro à 5 joueurs.\n\nCeci est irréversible.\n\nTape RESET (en majuscules) pour confirmer :"
  );
  if(typed !== "RESET"){ alert("Réinitialisation annulée."); return; }
  if(!confirm("Dernière confirmation : vraiment tout remettre à zéro ?")) return;

  Promise.all([
    db.collection("history").get(),
    db.collection("liveResults").get()
  ]).then(([histSnap, liveSnap])=>{
    const deletes = [];
    histSnap.forEach(d=> deletes.push(d.ref.delete()));
    liveSnap.forEach(d=> deletes.push(d.ref.delete()));
    deletes.push(db.collection("meta").doc("season").set({totals:{}}));
    deletes.push(db.collection("meta").doc("usedQuestions").set({}));
    return Promise.all(deletes);
  }).then(()=>{
    alert("Saison réinitialisée ! Tout repart à zéro pour Sorel, Jopa, Bambi, Thurell et Majes.");
    renderAdminDashboard();
  }).catch(err=>{
    alert("Erreur pendant la réinitialisation : " + (err && err.message ? err.message : err));
  });
}

/* Retrouve les parties jouées (liveResults) qui n'ont jamais été archivées dans l'historique
   -- par exemple si "Terminer ce jeu" n'avait pas été cliqué avant cette mise à jour --
   et les ajoute à l'historique + au classement de la saison. Ne supprime jamais rien. */
function recoverLostGames(){
  if(!confirm("Rechercher les parties jouées mais jamais enregistrées dans l'historique, et les récupérer ?")) return;
  Promise.all([
    db.collection("liveResults").get(),
    db.collection("history").get()
  ]).then(([liveSnap, histSnap])=>{
    const alreadyArchived = new Set();
    histSnap.forEach(d=>{ const data = d.data(); if(data.gameId) alreadyArchived.add(data.gameId); });

    const groups = {};
    liveSnap.forEach(d=>{
      const data = d.data();
      if(!data.gameId || alreadyArchived.has(data.gameId)) return;
      if(!groups[data.gameId]) groups[data.gameId] = { mode:data.mode, key:data.key, results:{}, finishedAtMs:null };
      groups[data.gameId].results[data.player] = data.mode === "quiz" ? data.score : data.outcomeKey;
      if(data.finishedAt && typeof data.finishedAt.toMillis === "function"){
        const ms = data.finishedAt.toMillis();
        if(!groups[data.gameId].finishedAtMs || ms > groups[data.gameId].finishedAtMs){
          groups[data.gameId].finishedAtMs = ms;
        }
      }
    });

    const gameIds = Object.keys(groups);
    if(gameIds.length === 0){
      alert("Aucune partie perdue trouvée, tout est déjà à jour !");
      return;
    }

    const tasks = [];
    const seasonUpdates = {};
    gameIds.forEach(gid=>{
      const g = groups[gid];
      const dateStr = g.finishedAtMs
        ? new Date(g.finishedAtMs).toLocaleDateString('fr-FR', {day:'2-digit', month:'2-digit', year:'numeric'})
        : todayStr();
      tasks.push(db.collection("history").add({
        gameId: gid, mode: g.mode, key: g.key, date: dateStr, results: g.results,
        createdAt: firebase.firestore.FieldValue.serverTimestamp()
      }));
      if(g.mode === "quiz"){
        Object.entries(g.results).forEach(([name,score])=>{
          if(!seasonUpdates[name]) seasonUpdates[name] = {points:0, games:0};
          seasonUpdates[name].points += score;
          seasonUpdates[name].games += 1;
        });
      }
    });

    Promise.all(tasks).then(()=>{
      if(Object.keys(seasonUpdates).length === 0){
        alert(gameIds.length + " partie(s) récupérée(s) !");
        renderAdminDashboard();
        return;
      }
      db.collection("meta").doc("season").get().then(seasonSnap=>{
        const season = seasonSnap.exists ? seasonSnap.data() : {totals:{}};
        if(!season.totals) season.totals = {};
        Object.entries(seasonUpdates).forEach(([name,delta])=>{
          if(!season.totals[name]) season.totals[name] = {points:0, games:0};
          season.totals[name].points += delta.points;
          season.totals[name].games += delta.games;
        });
        db.collection("meta").doc("season").set(season).then(()=>{
          alert(gameIds.length + " partie(s) récupérée(s) et ajoutée(s) au classement !");
          renderAdminDashboard();
        });
      });
    });
  });
}

/* Choisit 10 questions en évitant de répéter celles déjà utilisées récemment
   pour cette thématique, jusqu'à épuisement complet du stock (puis ça recommence). */
function pickRotatingQuestions(themeKey, count){
  return db.collection("meta").doc("usedQuestions").get().then(snap=>{
    const data = snap.exists ? snap.data() : {};
    let used = data[themeKey] || [];
    const allQuestions = THEMES[themeKey].questions;
    let available = allQuestions.filter(q => used.indexOf(q.q) === -1);
    if(available.length < count){
      used = [];
      available = allQuestions.slice();
    }
    const picked = shuffle(available).slice(0, count);
    const newUsed = used.concat(picked.map(p=>p.q));
    return db.collection("meta").doc("usedQuestions").set({[themeKey]: newUsed}, {merge:true}).then(()=> picked);
  });
}

function endGame(){
  if(!confirm("Terminer ce jeu et afficher le message d'attente à tout le monde ?")) return;
  db.collection("meta").doc("state").get().then(doc=>{
    const activeGame = doc.exists ? (doc.data().activeGame || null) : null;
    if(!activeGame){ renderAdminDashboardWith(null); return; }
    archiveGame(activeGame).then(()=>{
      db.collection("meta").doc("state").set({activeGame:null}).then(()=>{
        renderAdminDashboardWith(null);
      });
    });
  });
}

boot();
